[project]
name = "gmail-calendar-assistant-bot"
version = "1.1.0"
description = "Personal Telegram assistant for Gmail and Google Calendar"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
